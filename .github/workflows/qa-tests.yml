name: qa-tests
on: [push, pull_request]
jobs:
  node-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/unit tests/integration tests/network tests/a11y tests/perf tests/security tests/regression
