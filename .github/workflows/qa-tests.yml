name: qa-tests
on: [push, pull_request]
jobs:
  node-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "tests/unit/*.test.js" "tests/integration/*.test.js" "tests/network/*.test.js" "tests/a11y/*.test.js" "tests/perf/*.test.js" "tests/security/*.test.js" "tests/regression/*.test.js"
