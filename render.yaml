services:
  - type: web
    name: skytrack
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: POLL_MS
        value: 30000
      - key: OPENSKY_USER
        sync: false
      - key: OPENSKY_PASS
        sync: false
